openapi: 3.2.0
info:
  title: Fast Healthcare Interoperability Resources (FHIR) Document…
  description: This Section describes the expected capabilities of the US Core Server actor which is responsible for providing responses to the queries submitted by the US Core Requestors.
  license:
    name: Creative Commons Zero v1.0 Universal
    url: http://spdx.org/licenses/CC0-1.0.html
  version: 7.0.0
  contact:
    name: HL7 International / Cross-Group Projects
    email: cgp@lists.HL7.org
    url: http://www.hl7.org/Special/committees/cgp
tags:
- name: Document Reference
paths:
  /DocumentReference:
    summary: Manager for resources of type DocumentReference
    description: 'The Manager for resources of type DocumentReference: provides services to manage the collection of all the DocumentReference instances'
    get:
      summary: Fast Healthcare Interoperability Resources Search all resources of type…
      operationId: searchDocumentReference
      responses:
        '200':
          description: the resource being returned
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/Bundle
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/Bundle.xsd
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/pretty'
      - $ref: '#/components/parameters/summary'
      - $ref: '#/components/parameters/elements'
      - name: _id
        in: query
        schema:
          type: string
        description: "**Logical id of this artifact**  \n**NOTE**: This US Core SearchParameter definition extends the usage context of the\n[Conformance expectation extension](http://hl7.org/fhir/R4/extension-capabilitystatement-expectation.html)\n - multipleAnd\n - multipleOr\n - comparator\n - modifier\n - chain"
      - name: category
        in: query
        description: "**Categorization of document**  \n**NOTE**: This US Core SearchParameter definition extends the usage context of the\n[Conformance expectation extension](http://hl7.org/fhir/R4/extension-capabilitystatement-expectation.html)\n - multipleAnd\n - multipleOr\n - comparator\n - modifier\n - chain"
        schema:
          type: string
      - name: date
        in: query
        description: "**When this document reference was created**  \n**NOTE**: This US Core SearchParameter definition extends the usage context of the\n[Conformance expectation extension](http://hl7.org/fhir/R4/extension-capabilitystatement-expectation.html)\n - multipleAnd\n - multipleOr\n - comparator\n - modifier\n - chain"
        schema:
          type: string
          pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
      - name: patient
        in: query
        description: "**Who/what is the subject of the document**  \n**NOTE**: This US Core SearchParameter definition extends the usage context of the\n[Conformance expectation extension](http://hl7.org/fhir/R4/extension-capabilitystatement-expectation.html)\n - multipleAnd\n - multipleOr\n - comparator\n - modifier\n - chain"
        schema:
          type: string
      - name: period
        in: query
        description: "**Time of service that is being documented**  \n**NOTE**: This US Core SearchParameter definition extends the usage context of the\n[Conformance expectation extension](http://hl7.org/fhir/R4/extension-capabilitystatement-expectation.html)\n - multipleAnd\n - multipleOr\n - comparator\n - modifier\n - chain"
        schema:
          type: string
          pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
      - name: status
        in: query
        description: "**current | superseded | entered-in-error**  \n**NOTE**: This US Core SearchParameter definition extends the usage context of the\n[Conformance expectation extension](http://hl7.org/fhir/R4/extension-capabilitystatement-expectation.html)\n - multipleAnd\n - multipleOr\n - comparator\n - modifier\n - chain"
        schema:
          type: string
      - name: type
        in: query
        description: "**Kind of document (LOINC if possible)**  \n**NOTE**: This US Core SearchParameter definition extends the usage context of the\n[Conformance expectation extension](http://hl7.org/fhir/R4/extension-capabilitystatement-expectation.html)\n - multipleAnd\n - multipleOr\n - comparator\n - modifier\n - chain"
        schema:
          type: string
      tags:
      - Document Reference
    post:
      summary: Fast Healthcare Interoperability Resources Create a new resource
      operationId: createDocumentReference
      requestBody:
        description: The new state of the resource
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/DocumentReference
          application/fhir+xml:
            schema:
              $ref: https://hl7.org/fhir/R4/DocumentReference.xsd
      responses:
        '200':
          description: the resource being returned after being updated
          headers:
            ETag:
              description: Version from Resource.meta.version as a weak ETag
              schema:
                type: string
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/DocumentReference
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/DocumentReference.xsd
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/summary'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/pretty'
      - $ref: '#/components/parameters/elements'
      tags:
      - Document Reference
  /DocumentReference/{rid}:
    summary: Read/Write/etc resource instance of type DocumentReference
    description: Access to services to manage the state of a single resource of type DocumentReference
    get:
      summary: Fast Healthcare Interoperability Resources Read the current state of the…
      operationId: readDocumentReference
      responses:
        '200':
          description: the resource being returned
          headers:
            ETag:
              description: Version from Resource.meta.version as a weak ETag
              schema:
                type: string
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/DocumentReference
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/DocumentReference.xsd
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/rid'
      - $ref: '#/components/parameters/summary'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/pretty'
      - $ref: '#/components/parameters/elements'
      tags:
      - Document Reference
    put:
      summary: Fast Healthcare Interoperability Resources Update the current state of the…
      operationId: updateDocumentReference
      requestBody:
        description: The new state of the resource
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/DocumentReference
          application/fhir+xml:
            schema:
              $ref: https://hl7.org/fhir/R4/DocumentReference.xsd
      responses:
        '200':
          description: the resource being returned after being updated
          headers:
            ETag:
              description: Version from Resource.meta.version as a weak ETag
              schema:
                type: string
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/DocumentReference
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/DocumentReference.xsd
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/rid'
      - $ref: '#/components/parameters/summary'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/pretty'
      - $ref: '#/components/parameters/elements'
      tags:
      - Document Reference
    patch:
      summary: Fast Healthcare Interoperability Resources Change the current state of the…
      operationId: patchDocumentReference
      requestBody:
        description: The new state of the resource
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/DocumentReference
          application/fhir+json:
            schema:
              $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/Parameters
          application/xml-patch+xml:
            schema:
              $ref: https://hl7.org/fhir/R4/DocumentReference.xsd
          application/fhir+xml:
            schema:
              $ref: https://hl7.org/fhir/R4/Parameters.xsd
      responses:
        '200':
          description: the resource being returned after being patched
          headers:
            ETag:
              description: Version from Resource.meta.version as a weak ETag
              schema:
                type: string
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/DocumentReference
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/DocumentReference.xsd
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/rid'
      - $ref: '#/components/parameters/summary'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/pretty'
      - $ref: '#/components/parameters/elements'
      tags:
      - Document Reference
    delete:
      summary: Fast Healthcare Interoperability Resources Delete the resource so that it no…
      operationId: deleteDocumentReference
      responses:
        '204':
          description: If the resource is deleted - no content is returned
          headers:
            ETag:
              description: Version from Resource.meta.version as a weak ETag
              schema:
                type: string
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/rid'
      tags:
      - Document Reference
  /DocumentReference/{rid}/_history:
    summary: Read past versions of resource instance of type DocumentReference
    description: Access to previous versions of a single resource of type DocumentReference
    get:
      summary: Fast Healthcare Interoperability Resources Read the past states of the resource
      operationId: histinstDocumentReference
      responses:
        '200':
          description: the resources being returned
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/Bundle
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/Bundle.xsd
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/rid'
      - $ref: '#/components/parameters/summary'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/pretty'
      - $ref: '#/components/parameters/elements'
      - $ref: '#/components/parameters/count'
      - name: _since
        in: query
        description: Only include resource versions that were created at or after the given instant in time
        schema:
          type: string
          pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
      - name: _at
        in: query
        description: Only include resource versions that were current at some point during the time period specified in the date time value (see Search notes on date searching)
        schema:
          type: string
          pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
      - name: _list
        in: query
        description: Only include resource versions that are referenced in the specified list (current list references are allowed)
        schema:
          type: string
      tags:
      - Document Reference
  /DocumentReference/{rid}/_history/{hid}:
    summary: Read a past version of resource instance of type DocumentReference
    description: Access a to specified previous version of a single resource of type DocumentReference
    get:
      summary: Fast Healthcare Interoperability Resources Read a past state of the resource
      operationId: vreadDocumentReference
      responses:
        '200':
          description: the resource being returned
          headers:
            ETag:
              description: Version from Resource.meta.version as a weak ETag for that version
              schema:
                type: string
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/DocumentReference
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/DocumentReference.xsd
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/rid'
      - $ref: '#/components/parameters/hid'
      - $ref: '#/components/parameters/summary'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/pretty'
      - $ref: '#/components/parameters/elements'
      tags:
      - Document Reference
  /DocumentReference/_history:
    summary: Read past versions of resources of type DocumentReference
    description: Access to previous versions of resourcez of type DocumentReference
    get:
      summary: Fast Healthcare Interoperability Resources Read the past states of the resource
      operationId: histtypeDocumentReference
      responses:
        '200':
          description: the resources being returned
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/Bundle
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/Bundle.xsd
        default:
          description: Error, with details
          content:
            application/fhir+json:
              schema:
                $ref: https://hl7.org/fhir/R4/fhir.schema.json#/definitions/OperationOutcome
            application/fhir+xml:
              schema:
                $ref: https://hl7.org/fhir/R4/OperationOutcome.xsd
      parameters:
      - $ref: '#/components/parameters/summary'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/pretty'
      - $ref: '#/components/parameters/elements'
      - $ref: '#/components/parameters/count'
      - name: _since
        in: query
        description: Only include resource versions that were created at or after the given instant in time
        schema:
          type: string
          pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
      - name: _at
        in: query
        description: Only include resource versions that were current at some point during the time period specified in the date time value (see Search notes on date searching)
        schema:
          type: string
          pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
      - name: _list
        in: query
        description: Only include resource versions that are referenced in the specified list (current list references are allowed)
        schema:
          type: string
      tags:
      - Document Reference
components:
  parameters:
    hid:
      name: hid
      in: path
      description: id of the history entry (=Resource.meta.versionId)
      required: true
      allowEmptyValue: false
      style: simple
      schema:
        type: string
    rid:
      name: rid
      in: path
      description: id of the resource (=Resource.id)
      required: true
      allowEmptyValue: false
      style: simple
      schema:
        type: string
    elements:
      name: _elements
      in: query
      description: Requests the server to return a collection of elements from the resource
      allowEmptyValue: true
      style: form
      explode: false
      schema:
        type: array
        format: string
        items:
          format: string
    summary:
      name: _summary
      in: query
      description: Requests the server to return a designated subset of the resource
      allowEmptyValue: true
      style: form
      schema:
        type: string
        enum:
        - 'true'
        - text
        - data
        - count
        - 'false'
    count:
      name: _count
      in: query
      description: The maximum number of search results on a page. The server is not bound to return the number requested, but cannot return more
      schema:
        type: number
    format:
      name: _format
      in: query
      description: 'Specify alternative response formats by their MIME-types (when a client is unable acccess accept: header)'
      allowEmptyValue: true
      style: form
      schema:
        type: string
        format: mime-type
    pretty:
      name: _pretty
      in: query
      description: Ask for a pretty printed response for human convenience
      allowEmptyValue: true
      style: form
      schema:
        type: boolean
externalDocs:
  url: http://hl7.org/fhir/us/core/CapabilityStatement/us-core-server
  description: FHIR CapabilityStatement
